{% extends "study/base_study.html" %}

{% block title %}Опрос отправлен · Путёвка в жизнь{% endblock %}

{% block study_content %}
<div class="mx-auto" style="max-width: 800px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">Ответы отправлены</h1>
      <p class="mb-2">Опрос «{{ submission.survey_title }}» сохранён.</p>
      <p class="text-muted mb-4">Дата отправки: {{ submission.submitted_at|date:"d.m.Y H:i" }}</p>
      <a class="btn btn-outline-primary" href="{% url 'study:schools' %}">Вернуться в «Мою учёбу»</a>
    </div>
  </div>
</div>
{% endblock %}
