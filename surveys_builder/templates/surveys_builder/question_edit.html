<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактирование вопроса</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            color: #212529;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
        }

        form {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin: 0 0 0 5px;
            vertical-align: middle;
        }

        textarea {
            min-height: 100px;
        }

        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        a {
            color: #0d6efd;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="{% url 'surveys_builder:survey_detail' pk=survey.pk %}">
        ← Вернуться к опроснику
    </a>

    <h1>Редактировать вопрос</h1>
    <p>Опросник: {{ survey.title }}</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Сохранить изменения</button>
    </form>
</body>
</html>
