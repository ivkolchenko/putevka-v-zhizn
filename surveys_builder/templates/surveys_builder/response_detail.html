{% extends 'surveys_builder/base.html' %}
{% block content %}
<h1>{{ survey.title }}</h1>
<p>{{ response.assignment.recipient_snapshot.name }} · {{ response.submitted_at }}</p>
<dl>{% for question, value in rows %}<dt>{{ question }}</dt><dd>{{ value|linebreaksbr }}</dd>{% endfor %}</dl>
<a href="{% url 'surveys_builder:results' survey.pk %}">Вернуться к результатам</a>
{% endblock %}
