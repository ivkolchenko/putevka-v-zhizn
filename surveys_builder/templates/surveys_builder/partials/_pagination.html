{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav aria-label="Страницы">
{% if page_obj.has_previous %}<a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}
Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}
{% if page_obj.has_next %}<a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Далее</a>{% endif %}
</nav>
{% endif %}
